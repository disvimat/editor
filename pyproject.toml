[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disvimat"
version = "0.1.0"
description = "Editor científico accesible DISVIMAT (matemáticas y química) para personas con discapacidad visual"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
authors = [{ name = "Carlos Daniel Ondo Angue", email = "info@iataccess.org" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
desktop = [
    "wxPython>=4.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.gui-scripts]
disvimat-escritorio = "disvimat.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disvimat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["disvimat"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["wx", "wx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# wx no publica tipos: en el adaptador de escritorio se relajan las
# comprobaciones que dependen de ellos. El núcleo sigue en estricto.
module = "disvimat.desktop.*"
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
