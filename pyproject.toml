[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disvimat"
version = "0.1.0"
description = "Editor científico accesible DISVIMAT (matemáticas y química) para personas con discapacidad visual"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
authors = [{ name = "Carlos Daniel Ondo Angue", email = "info@iataccess.org" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
desktop = [
    "wxPython>=4.2",
    # Speaks through the user's screen reader (NVDA, JAWS) or SAPI. Without
    # it the editor still runs, but only shows its feedback in the status
    # bar, which a screen reader does not read on its own.
    "accessible_output2>=0.14",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# MathCAT (DAISY) for speech and normative braille is NOT on PyPI, so it
# cannot be a dependency here. Install the prebuilt binding with
# `python scripts/install_mathcat.py`; the app degrades to its own tables
# when it is absent. See docs/en/MATHCAT.md.
mathcat = []
# liblouis for official text braille is a native library, not a pip package.
# Install it with `python scripts/install_liblouis.py` (or the system
# package manager). See docs/en/BRAILLE.md.
liblouis = []
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.gui-scripts]
disvimat-escritorio = "disvimat.desktop.app:main"

[project.scripts]
disvimat-web = "disvimat.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disvimat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["disvimat"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["wx", "wx.*", "uvicorn", "accessible_output2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# wx no publica tipos: en el adaptador de escritorio se relajan las
# comprobaciones que dependen de ellos. El núcleo sigue en estricto.
module = "disvimat.desktop.*"
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
