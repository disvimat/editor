[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disvimat"
version = "0.1.0"
description = "Editor científico accesible DISVIMAT (matemáticas y química) para personas con discapacidad visual"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
authors = [{ name = "Carlos Daniel Ondó Angue", email = "info@iataccess.org" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/disvimat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["disvimat"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
