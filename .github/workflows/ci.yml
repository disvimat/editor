name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tipos (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest
