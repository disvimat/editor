name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    name: Core and web (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The desktop extra (wxPython) is left out here: it needs GTK build
      # dependencies on Linux. The desktop job below covers it on Windows,
      # which is the platform it is actually used on.
      - name: Install dependencies
        run: pip install -e ".[web,dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  desktop:
    name: Desktop (Windows + wxPython)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # wxPython ships Windows wheels, so this is a download rather than a
      # build. This job exists because the desktop is the interface blind
      # users reach through NVDA, on Windows: leaving it untested on the
      # platform it ships for was the largest hole in this pipeline.
      - name: Install dependencies
        run: pip install -e ".[desktop,web,dev]"
      - name: Tests (pytest)
        # Without this the desktop tests skip themselves when wxPython is
        # missing, and a broken install would report a green build while
        # testing nothing. Here they must run.
        env:
          DISVIMAT_REQUIRE_DESKTOP: "1"
        run: pytest
